# lane-unique $CARGO_TARGET_DIR before building.
# Fresh slate: `cargo clean` in the worktree (clears only its own target),
# periodic trim via ~/bin/cargo-tidy.
[build]
# target-dir intentionally unset; $CARGO_TARGET_DIR governs (per-worktree).

