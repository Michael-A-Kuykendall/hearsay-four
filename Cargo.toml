# Unified workspace root (beads hearsay-four-5qc, hearsay-four-pbq E2):
# every pipeline crate is a workspace member, so `cargo test --workspace`
# is the regression gate and `cargo build --bin hearsay-demo` covers the
# release matrix. `src/wasm-demo` stays excluded: it declares its own
# `[workspace]` (wasm-only, pinned wasm-bindgen) and is not part of the
# host test/release matrix.
#
# Feature-unification contract (E2):
# - `capture`'s `mic` feature (cpal) stays OPTIONAL and off by default, so
#   the default workspace build/test needs no cpal system deps.
# - `capture`'s `record-session` bin keeps `required-features = ["mic"]`,
#   so it is skipped by default builds and compiled only under
#   `cargo build -p capture --features mic`.
# - `hearsay-demo` / `hearsay-serve` (runner) must NOT require `mic`: the
#   runner takes file/stdin WAV input only and has no capture dependency,
#   so the release matrix stays green without system audio libs.
[workspace]
members = [
    "src/accent",
    "src/arena",
    "src/calibration",
    "src/capture",
    "src/corpus",
    "src/fabric",
    "src/fse",
    "src/groebner",
    "src/hearsay",
    "src/invariant_ppt",
    "src/lexicon",
    "src/lm",
    "src/output",
    "src/runner",
    "src/sequence",
    "src/stage3",
    "src/hmm",
    "src/lattice",
    "src/eval",
    "src/decoder",
    "src/a2",
]
exclude = [
    "src/wasm-demo",
]
resolver = "2"
