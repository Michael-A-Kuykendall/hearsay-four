[package]
name = "corpus"
version = "0.1.0"
edition = "2024"

[dependencies]
hound = "3.5.1"
# MP3 decoding: symphonia replaces minimp3 (Dependabot GHSA-7mcq-f592-pf7v:
# slice-ring-buffer <=0.3.4 double-free, unpatched; minimp3 0.5 is unmaintained).
symphonia = { version = "0.5.4", default-features = false, features = ["mp3"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
invariant_ppt = { path = "../invariant_ppt" }

[dev-dependencies]
proptest = "1.11.0"
