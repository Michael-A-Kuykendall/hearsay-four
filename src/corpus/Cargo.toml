[package]
name = "corpus"
version = "0.1.0"
edition = "2024"

[dependencies]
hound = "3.5.1"
minimp3 = "0.5.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
invariant_ppt = { path = "../invariant_ppt" }

[dev-dependencies]
proptest = "1.11.0"
