[package]
name = "hmm"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
# float_roundtrip: enrollment facts must persist bit-exactly so retraction
# after a save/load cycle still restores the base exactly (default float
# parsing can drift by 1 ulp).
serde_json = { version = "1", features = ["float_roundtrip"] }
fabric = { path = "../fabric" }
# Parallel Baum-Welch E-step over utterances (rayon; deterministic ordered
# merge keeps training likelihoods identical to the serial path).
rayon = "1"

[dev-dependencies]
serde_json = "1"
# Real-data gate (real_data_gate_tests): existing audio/feature/lexicon paths.
corpus = { path = "../corpus" }
fse = { path = "../fse" }
lexicon = { path = "../lexicon" }
# r2_perf wordlist-scan mode: lm::normalize_text census tokenizer.
lm = { path = "../lm" }
# R3 SI base gate (r3_si_base_tests): canonical WER scorer for SI DEV WER.
output = { path = "../output" }
