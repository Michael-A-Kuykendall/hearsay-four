[package]
name = "hmm"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
serde_json = "1"
# Real-data gate (real_data_gate_tests): existing audio/feature/lexicon paths.
corpus = { path = "../corpus" }
fse = { path = "../fse" }
lexicon = { path = "../lexicon" }
# R3 SI base gate (r3_si_base_tests): canonical WER scorer for SI DEV WER.
output = { path = "../output" }
